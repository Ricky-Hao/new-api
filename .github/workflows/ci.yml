name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Closed PRs need the base repository token, including merges from forks.
  # Every job gates this event on merged before executing the merged code.
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Open PRs test the normal merge preview; merged PRs test their final merge SHA.
# All three jobs use that same immutable commit even if main advances.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event_name == 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        env:
          GOFLAGS: -timeout=20m
        run: make test

  frontend:
    name: Frontend typecheck and test
    if: github.event_name == 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun check -b

      - name: Test
        run: bun run test

  image:
    name: Build, verify, and publish service image
    needs: [backend, frontend]
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.repository == 'Ricky-Hao/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Keep publication serial without cancelling a running push. Tests may
    # finish out of merge order, so latest also checks main before updating.
    concurrency:
      group: ghcr-new-api-main
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/ricky-hao/new-api
      BUILD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      BUILD_VERSION: ricky-hao-sha-${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - name: Checkout checked merge commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Set fork build version
        run: printf '%s\n' "$BUILD_VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build service image once and load locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ env.BUILD_SHA }}
          labels: |
            org.opencontainers.image.title=New API
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}

      - name: Verify container startup
        timeout-minutes: 2
        run: |
          docker run --detach --name new-api-smoke \
            --publish 127.0.0.1:3000:3000 "$IMAGE:sha-$BUILD_SHA"
          curl --fail --silent --show-error --max-time 2 \
            --retry 20 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:3000/api/status | jq -e '.success == true'

      - name: Clean up smoke container
        if: always()
        run: |
          if docker container inspect new-api-smoke > /dev/null 2>&1; then
            docker logs new-api-smoke
            docker rm --force --volumes new-api-smoke
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker push "$IMAGE:sha-$BUILD_SHA"
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$MAIN_SHA" == "$BUILD_SHA" ]]; then
            docker tag "$IMAGE:sha-$BUILD_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          else
            echo "Main has advanced to $MAIN_SHA; published sha-$BUILD_SHA without changing latest."
          fi
